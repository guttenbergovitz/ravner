image: atlassian/default-image:5

options:
  runtime:
    cloud:
      arch: arm

definitions:
  services:
    docker:
      image: docker:28.5-dind
  steps:
    - step: &build-and-deploy
        name: Build and Deploy
        oidc: true
        services:
          - docker
        script:
          - apt-get update && apt-get -y install gettext-base
          - export AWS_REGION=$AWS_DEFAULT_REGION
          - export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          - echo $BITBUCKET_STEP_OIDC_TOKEN > $AWS_WEB_IDENTITY_TOKEN_FILE
          - export COMMIT_SHORT=${BITBUCKET_COMMIT:0:7}
          - export IMAGE_TAG=${BITBUCKET_DEPLOYMENT_ENVIRONMENT}-${COMMIT_SHORT}
          - export IMAGE_LATEST_TAG=${BITBUCKET_DEPLOYMENT_ENVIRONMENT}-latest
          - if [[ $BITBUCKET_DEPLOYMENT_ENVIRONMENT == "production" ]]; then export IMAGE_TAG=${BITBUCKET_TAG:-$COMMIT_SHORT}; export IMAGE_LATEST_TAG=latest; fi
          - echo "Building image '${IMAGE_REPOSITORY}:${IMAGE_TAG}'..."
          - >
            docker build
            -t ${IMAGE_NAME}:${IMAGE_TAG}
            -t ${IMAGE_NAME}:${IMAGE_LATEST_TAG}
            -t ${IMAGE_REPOSITORY}:${IMAGE_TAG}
            -t ${IMAGE_REPOSITORY}:${IMAGE_LATEST_TAG} .
          - pipe: atlassian/aws-ecr-push-image:2.6.0
            variables:
              AWS_OIDC_ROLE_ARN: $AWS_OIDC_ECR_ROLE_ARN
              IMAGE_NAME: $IMAGE_NAME
              TAGS: $IMAGE_TAG $IMAGE_LATEST_TAG
          - echo "Image '${IMAGE_REPOSITORY}:${IMAGE_TAG}' pushed"
          - echo "================================================================================"
          - echo "Deploying service '${ECS_SERVICE_NAME}' to cluster '${ECS_CLUSTER_NAME}'..."
          - export ECS_TASK_DEFINITION_FILE=$(pwd)/task-definition.json
          - envsubst < $ECS_TASK_DEFINITION_TEMPLATE > $ECS_TASK_DEFINITION_FILE
          - pipe: atlassian/aws-ecs-deploy:1.15.0
            variables:
              AWS_OIDC_ROLE_ARN: $AWS_OIDC_ECS_ROLE_ARN
              CLUSTER_NAME: $ECS_CLUSTER_NAME
              SERVICE_NAME: $ECS_SERVICE_NAME
              TASK_DEFINITION: $ECS_TASK_DEFINITION_FILE
          - echo "Service '${ECS_SERVICE_NAME}' deployed to cluster '${ECS_CLUSTER_NAME}'"
          - echo "================================================================================"

pipelines:
  # tags:
  #   'v*':
  #     - step:
  #         name: Prepare to Production
  #         script:
  #           - "echo 'Preparing to Deploy to Production'"
  #     - step:
  #         <<: *build-and-deploy
  #         name: Build and deploy to Production
  #         deployment: production
  #         trigger: manual
  #         runs-on:
  #           - self.hosted
  #           - docker
  #           - webplatform.prod
  #           - ecs
  #           - arm64
  #           - linux.arm64
  branches:
    staging:
      - step:
          name: Prepare to Staging
          script:
            - "echo 'Preparing to deploy to Staging'"
      - step:
          <<: *build-and-deploy
          name: Build and Deploy to Staging
          deployment: staging
          runs-on:
            - self.hosted
            - docker
            - webplatform.stage
            - ecs
            - arm64
            - linux.arm64
