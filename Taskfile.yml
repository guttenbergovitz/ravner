# https://taskfile.dev — install with `brew install go-task/tap/go-task`.
# Run `task --list` to see all available tasks.
version: "3"

vars:
  IMAGE: ravner:latest
  COMPOSE: docker compose

tasks:
  default:
    desc: Show the task list
    cmds:
      - task --list

  # ── Local dev (Mix) ────────────────────────────────────────────────────────
  setup:
    desc: Fetch deps, set up DB, install asset tooling
    cmds:
      - mix setup

  server:
    desc: Run Phoenix in dev with code reload
    cmds:
      - mix phx.server

  iex:
    desc: Start IEx with the app
    cmds:
      - iex -S mix phx.server

  test:
    desc: Run the full test suite
    cmds:
      - mix test

  format:
    desc: Format the codebase
    cmds:
      - mix format

  precommit:
    desc: Compile (warnings as errors), prune unused deps, format, test
    cmds:
      - mix precommit

  ecto:reset:
    desc: Drop & recreate the dev database, then seed
    cmds:
      - mix ecto.reset

  # ── Container image ────────────────────────────────────────────────────────
  docker:build:
    desc: Build the production image
    cmds:
      - docker build -t {{.IMAGE}} .

  docker:secret:
    desc: Generate a SECRET_KEY_BASE you can export for compose
    cmds:
      - mix phx.gen.secret

  docker:up:
    desc: Start the full stack (db, migrate, app) in the background
    preconditions:
      - sh: '[ -n "$SECRET_KEY_BASE" ]'
        msg: 'SECRET_KEY_BASE is not set — run `task docker:secret` and `export SECRET_KEY_BASE=…`'
    cmds:
      - "{{.COMPOSE}} up -d --build"

  docker:down:
    desc: Stop the stack (keeps the postgres volume)
    cmds:
      - "{{.COMPOSE}} down"

  docker:nuke:
    desc: Stop the stack AND drop the postgres volume
    cmds:
      - "{{.COMPOSE}} down -v"

  docker:logs:
    desc: Tail logs from the app container
    cmds:
      - "{{.COMPOSE}} logs -f app"

  docker:migrate:
    desc: Run pending migrations against the running stack
    cmds:
      - "{{.COMPOSE}} run --rm migrate"

  docker:shell:
    desc: Open a shell inside the running app container
    cmds:
      - "{{.COMPOSE}} exec app sh"

  docker:remote:
    desc: Attach an IEx remote console to the running release
    cmds:
      - "{{.COMPOSE}} exec app /app/bin/ravner remote"

  docker:verify-tools:
    desc: Sanity-check the CLI tools bundled in the image (pg_dump, whois, dnsx)
    cmds:
      - docker run --rm {{.IMAGE}} sh -c 'pg_dump --version && whois --version | head -1 && dnsx -version'
