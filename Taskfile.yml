version: '3'

vars:
  # ── Auto-detect container runtime (prefer Podman) ──────────────────────────
  RUNTIME:
    sh: |
      if command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then
        echo "podman"
      elif command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
        echo "docker"
      else
        echo ""
      fi

  IMAGE: ravner:latest
  CONTAINER_NAME: ravner-web

  # Load .env into environment variables for docker/podman commands
  ENV_ARGS:
    sh: |
      if [ -f .env ]; then
        while IFS='=' read -r key value; do
          case "$key" in
            ''|'#'*) continue ;;
          esac
          printf '%s' " -e $key=$value"
        done < .env
      fi

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Runtime detection ──────────────────────────────────────────────────────
  detect:
    desc: Detect active container runtime
    silent: true
    cmds:
      - |
        if [ "{{.RUNTIME}}" = "" ]; then
          echo "❌ No container runtime detected."
          echo "   Start Docker Desktop or Podman Desktop and try again."
          exit 1
        else
          echo "✅ Using container runtime: {{.RUNTIME}}"
        fi

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    desc: Build the container image
    deps: [detect]
    cmds:
      - "{{.RUNTIME}} build -t {{.IMAGE}} ."

  # ── Run ────────────────────────────────────────────────────────────────────
  run:
    desc: Run the app in a container (foreground)
    deps: [detect]
    cmds:
      - |
        {{.RUNTIME}} run --rm \
          --name {{.CONTAINER_NAME}} \
          -p 4000:4000 \
          -e PHX_SERVER=true \
          -e PORT=4000 \
          -e PHX_HOST="${PHX_HOST:-localhost}" \
          {{.ENV_ARGS}} \
          {{.IMAGE}}

  # ── Start (detached) ───────────────────────────────────────────────────────
  start:
    desc: Start the app in the background
    deps: [detect]
    cmds:
      - |
        {{.RUNTIME}} run -d \
          --name {{.CONTAINER_NAME}} \
          -p 4000:4000 \
          -e PHX_SERVER=true \
          -e PORT=4000 \
          -e PHX_HOST="${PHX_HOST:-localhost}" \
          {{.ENV_ARGS}} \
          {{.IMAGE}}

  # ── Stop ───────────────────────────────────────────────────────────────────
  stop:
    desc: Stop and remove the running container
    deps: [detect]
    cmds:
      - "{{.RUNTIME}} rm -f {{.CONTAINER_NAME}}"

  # ── Logs ───────────────────────────────────────────────────────────────────
  logs:
    desc: Tail logs from the running container
    deps: [detect]
    cmds:
      - "{{.RUNTIME}} logs -f {{.CONTAINER_NAME}}"

  # ── Status ─────────────────────────────────────────────────────────────────
  status:
    desc: Show running container status
    deps: [detect]
    cmds:
      - "{{.RUNTIME}} ps --filter name={{.CONTAINER_NAME}}"

  # ── Shell ──────────────────────────────────────────────────────────────────
  shell:
    desc: Open a shell inside the running container
    deps: [detect]
    cmds:
      - "{{.RUNTIME}} exec -it {{.CONTAINER_NAME}} /bin/bash"

  # ── Migrate ────────────────────────────────────────────────────────────────
  migrate:
    desc: Run Ecto migrations inside the container
    deps: [detect]
    cmds:
      - "{{.RUNTIME}} exec {{.CONTAINER_NAME}} /app/bin/migrate"
